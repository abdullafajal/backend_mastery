          - "Working with files": 02-linux-command-line/02-working-with-files.md
          - "Users and permissions": 02-linux-command-line/03-users-and-permissions.md
          - "Pipes and redirection": 02-linux-command-line/04-pipes-and-redirection.md
          - "Env vars, packages, jobs": 02-linux-command-line/05-env-packages-jobs.md
          - "SSH": 02-linux-command-line/06-ssh.md
          - "systemd and logs": 02-linux-command-line/07-systemd-and-logs.md
      - "3. Git and GitHub":
